[package]
name = "iron"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.29.0"
derive_more = { version = "2.1.1", features = ["full"] }
itertools = "0.14.0"
ropey = "=2.0.0-beta.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -2 }
missing_errors_doc = "allow"

[dev-dependencies]
color-eyre = "0.6.5"
tempfile = "3.27.0"
